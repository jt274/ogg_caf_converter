name: Dart CI

on:
  # Run on PRs and pushes to master and dev branches.
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  PUB_ENVIRONMENT: bot.github

jobs:
  # Check code formatting and static analysis on a single OS (linux)
  # against Dart dev.
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [dev]
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - id: install
        name: Install dependencies
        run: dart pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
        if: always() && steps.install.outcome == 'success'
      - name: Analyze code
        run: dart analyze --fatal-infos
        if: always() && steps.install.outcome == 'success'

  # Run tests
  test:
    needs: analyze
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        sdk: [stable, dev]
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - id: install
        name: Install dependencies
        run: dart pub get
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg
      - name: Run VM tests
        run: dart test --platform vm
        if: always() && steps.install.outcome == 'success'

  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: dev
      - name: Install dependencies
        run: dart pub get
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install coverage
        run: dart pub global activate coverage
      - name: Collect and report coverage
        run: dart pub global run coverage:test_with_coverage
      - name: Upload coverage
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: coverage/lcov.info

  web-build:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - id: install
        name: Install dependencies
        run: dart pub get
      - name: Verify Dart Web Compilation
        run: dart compile js -o /tmp/example.js example/lib/main.dart
      - name: Verify Flutter Web App Build
        run: |
          flutter create --platforms=web /tmp/test_web_app
          cd /tmp/test_web_app
          flutter pub add 'ogg_caf_converter:{"path":"'$GITHUB_WORKSPACE'"}'
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:ogg_caf_converter/ogg_caf_converter.dart';

          void main() {
            runApp(MaterialApp(home: Scaffold(body: Text('$OggCafConverter'))));
          }
          EOF
          flutter build web

